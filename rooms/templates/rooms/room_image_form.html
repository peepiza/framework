{% extends "base.html" %}
{% block title %}Фотография помещения{% endblock %}
{% block content %}
<h1>Фотография помещения {{ room.name }}</h1>
<form method="post" enctype="multipart/form-data" class="mt-3">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="btn btn-primary">Сохранить</button>
    <a class="btn btn-outline-secondary" href="{{ room.get_absolute_url }}">К помещению</a>
</form>
{% endblock %}
