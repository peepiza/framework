{% extends "base.html" %}
{% block title %}Помещения - Сервис репетиций{% endblock %}

{% block content %}
<h1>Помещения</h1>
<form method="get" class="mb-3">
    <label for="q" class="form-label">Название или адрес</label>
    <div class="input-group">
        <input id="q" name="q" class="form-control" value="{{ query }}">
        <button class="btn btn-primary">Найти</button>
    </div>
</form>
<p class="text-muted">Всего помещений: {{ rooms|length }}</p>
<div class="row mt-3">
    {% for room in rooms %}
        <div class="col-md-6">
            {% include "rooms/includes/room_card.html" %}
        </div>
    {% empty %}
        <p>Помещения не найдены.</p>
    {% endfor %}
</div>
{% endblock %}
