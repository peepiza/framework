{% for error in form.non_field_errors %}<p class="text-danger">{{ error }}</p>{% endfor %}
{% for field in form %}
    <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<p class="form-text">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="text-danger">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
