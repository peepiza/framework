{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис репетиций{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Наш CSS -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light">
    <nav class="nav bg-dark p-3 mb-4">
        <a class="nav-link text-white" href="{% url 'homepage:index' %}">Главная</a>
        <a class="nav-link text-white" href="{% url 'rooms:rooms' %}">Помещения</a>
        <a class="nav-link text-white" href="{% url 'rehearsals:rehearsals' %}">Репетиции</a>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-muted">
        <p>© <span id="current-year"></span> Сервис планирования репетиций</p>
    </footer>

    <!-- Наш JavaScript -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
